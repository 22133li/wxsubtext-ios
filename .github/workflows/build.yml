name: Build roothide deb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOTHIDE_THEOS_COMMIT: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install RootHide Theos
        shell: bash
        env:
          THEOS: ${{ runner.temp }}/roothide-theos
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$ROOTHIDE_THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive
          printf 'THEOS=%s\n' "$THEOS" >> "$GITHUB_ENV"
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$ROOTHIDE_THEOS_COMMIT"

      - name: Build roothide package
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide \
            ARCHS="arm64 arm64e"

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          deb=(packages/*.deb)
          test ${#deb[@]} -eq 1
          echo "== control =="
          dpkg-deb -f "${deb[0]}" Package Version Architecture
          echo "== file list =="
          dpkg-deb -c "${deb[0]}"
          test "$(dpkg-deb -f "${deb[0]}" Architecture)" = "iphoneos-arm64e"

      - name: Record checksum
        shell: bash
        run: shasum -a 256 packages/*.deb | tee packages/SHA256SUMS

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: wxsubtext-roothide
          path: |
            packages/*.deb
            packages/SHA256SUMS
          if-no-files-found: error
